name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet restore VibeZone.slnx
      - name: Format
        run: dotnet format VibeZone.slnx --verify-no-changes --no-restore
      - name: Build (warnings as errors; regenerates openapi/vibezone-api.json)
        run: dotnet build VibeZone.slnx -c Release --no-restore -warnaserror
      - name: OpenAPI contract is committed
        run: git diff --exit-code -- openapi/
      - name: No pending model changes without a migration
        run: dotnet ef migrations has-pending-model-changes --project src/VibeZone.Migrations --startup-project src/VibeZone.Migrations --no-build --configuration Release
      - name: Test (unit, architecture, integration via Testcontainers)
        run: dotnet test --solution VibeZone.slnx -c Release --no-build
      - name: Vulnerable packages
        run: |
          dotnet list VibeZone.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -qE '^\s+>' vulnerable.txt

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: API client matches OpenAPI contract
        run: npm run api:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: vibezone
          POSTGRES_USER: vibezone
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vibezone -d vibezone"
          --health-interval 5s --health-timeout 5s --health-retries 12
      # Real SMTP + inbox API: e2e tests open the verification/reset links users receive.
      mailpit:
        image: axllent/mailpit:v1.31.6
        ports: ["1025:1025", "8025:8025"]
    env:
      ConnectionStrings__Database: Host=localhost;Port=5432;Database=vibezone;Username=vibezone;Password=ci-only-password
      MAILPIT_URL: http://localhost:8025
      # API (Development settings: localhost:9000, bucket vibezone-media) and worker share this CI-only MinIO.
      Storage__AccessKey: ci-minio
      Storage__SecretKey: ci-only-minio-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: dotnet tool restore
      - run: dotnet build src/VibeZone.Api -warnaserror
      - name: Apply migrations
        run: bash scripts/db-migrate.sh
      # Not a service container: MinIO needs a command (`server /data`), which services can't pass.
      - name: Object storage (MinIO)
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER="$Storage__AccessKey" -e MINIO_ROOT_PASSWORD="$Storage__SecretKey" \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for i in $(seq 1 30); do curl -fsS http://localhost:9000/minio/health/live && break; sleep 1; done
          docker exec minio sh -c 'mc alias set local http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing local/vibezone-media'
      - name: Media worker (real FFmpeg image)
        run: |
          docker build -f src/VibeZone.Worker/Dockerfile -t vibezone-worker:ci .
          docker run -d --name worker --network host \
            -e ConnectionStrings__Database -e Storage__AccessKey -e Storage__SecretKey \
            -e Storage__ServiceUrl=http://localhost:9000 -e Storage__Bucket=vibezone-media \
            vibezone-worker:ci
      - name: Install web dependencies and browser
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build web
        working-directory: apps/web
        run: npm run build
      - name: Playwright
        working-directory: apps/web
        run: npx playwright test
      - name: Worker logs
        if: failure()
        run: docker logs worker 2>&1 | tail -200
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # Pull requests: the images still build. Pushes to main: publish (below) builds and pushes instead.
  images:
    name: Container images (build check)
    if: github.event_name == 'pull_request'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, context: ., file: src/VibeZone.Api/Dockerfile, target: runtime }
          - { name: migrator, context: ., file: src/VibeZone.Api/Dockerfile, target: migrator }
          - { name: worker, context: ., file: src/VibeZone.Worker/Dockerfile, target: runtime }
          - { name: web, context: apps/web, file: apps/web/Dockerfile, target: runtime }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          tags: vibezone-${{ matrix.name }}:ci

  # main only, after every test incl. e2e: arm64 images (production host is Graviton, ADR-0014) to GHCR,
  # tagged with the commit sha, with SBOM + provenance attestations, keyless cosign signature and a Trivy gate.
  # Native arm64 runners are free for public repositories; set vars.ARM_RUNNER to override.
  publish:
    name: Publish images (${{ matrix.name }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, e2e]
    runs-on: ${{ vars.ARM_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing (Sigstore)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, context: ., file: src/VibeZone.Api/Dockerfile, target: runtime }
          - { name: migrator, context: ., file: src/VibeZone.Api/Dockerfile, target: migrator }
          - { name: worker, context: ., file: src/VibeZone.Worker/Dockerfile, target: runtime }
          - { name: web, context: apps/web, file: apps/web/Dockerfile, target: runtime }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/vibezone-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign (keyless)
        run: cosign sign --yes "$IMAGE@${{ steps.build.outputs.digest }}"
      # --platform: the index holds arm64 only and Trivy would otherwise look for amd64.
      # --scanners vuln: secret scanning of the image took minutes (gitleaks covers the repository); the worker
      # image still needs ~5 min, Trivy's default timeout.
      - name: Scan (fail on fixable critical CVEs)
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD aquasec/trivy:0.75.0 image \
            --platform linux/arm64 --scanners vuln --timeout 15m --skip-version-check \
            --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$IMAGE@${{ steps.build.outputs.digest }}"
