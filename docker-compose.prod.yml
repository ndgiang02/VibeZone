# VibeZone — single-host production topology (ADR-0014): one EC2 instance, AWS S3 for media, SES for email.
#
# Runs prebuilt images from GHCR (built and signed by CI); nothing is built on the server.
#   IMAGE_TAG=<git sha> docker compose -f docker-compose.prod.yml --env-file .env up -d --wait
# Normally invoked by scripts/deploy/deploy.sh (see docs/runbooks/deploy-aws.md), which writes .env from
# SSM Parameter Store. Only Caddy publishes ports (80/443); everything else stays on the private network.

name: vibezone

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  logging:
    driver: local
    options:
      max-size: "20m"
      max-file: "5"

x-database: &database
  ConnectionStrings__Database: Host=postgres;Database=${POSTGRES_DB:-vibezone};Username=${POSTGRES_USER:-vibezone};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

# AWS S3 through the instance role: no ServiceUrl, no static keys (StorageOptions falls back to the SDK chain).
# Containers reach the instance metadata service only if the instance's IMDS hop limit is 2 (runbook).
x-storage: &storage
  Storage__Region: ${AWS_REGION:?AWS_REGION must be set}
  Storage__Bucket: ${S3_BUCKET_MEDIA:?S3_BUCKET_MEDIA must be set}
  Storage__ForcePathStyle: "false"

services:
  postgres:
    <<: *hardening
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vibezone}
      POSTGRES_USER: ${POSTGRES_USER:-vibezone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [internal]

  migrate:
    <<: *hardening
    image: ${IMAGE_REGISTRY:-ghcr.io/ndgiang02}/vibezone-migrator:${IMAGE_TAG:?IMAGE_TAG must be set}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *database
    networks: [internal]

  api:
    <<: *hardening
    image: ${IMAGE_REGISTRY:-ghcr.io/ndgiang02}/vibezone-api:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: [*database, *storage]
      ASPNETCORE_ENVIRONMENT: Production
      App__PublicBaseUrl: https://${WEB_DOMAIN:?WEB_DOMAIN must be set}
      Email__From: ${EMAIL_FROM:?EMAIL_FROM must be set}
      Email__SmtpHost: ${SMTP_HOST:?SMTP_HOST must be set}
      Email__SmtpPort: ${SMTP_PORT:-587}
      Email__SmtpSecurity: StartTls
      Email__SmtpUsername: ${SMTP_USERNAME:?SMTP_USERNAME must be set}
      Email__SmtpPassword: ${SMTP_PASSWORD:?SMTP_PASSWORD must be set}
      # TLS terminates at Caddy; trust its X-Forwarded-For/Proto (fixed address below) for client IPs and HTTPS.
      Security__SecureCookies: "true"
      ReverseProxy__KnownProxies__0: 172.30.0.10
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |-
          exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 8s
      retries: 3
      start_period: 30s
    mem_limit: 768m
    networks: [internal]

  # Parses untrusted uploads with FFmpeg: non-root image, bounded CPU/memory, no ports.
  worker:
    <<: *hardening
    image: ${IMAGE_REGISTRY:-ghcr.io/ndgiang02}/vibezone-worker:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: [*database, *storage]
      Media__MaxConcurrentJobs: "1"
    cpus: 1.5
    mem_limit: 1g
    networks: [internal]

  web:
    <<: *hardening
    image: ${IMAGE_REGISTRY:-ghcr.io/ndgiang02}/vibezone-web:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://api:8080
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    networks: [internal]

  # Edge: automatic HTTPS (Let's Encrypt) for WEB_DOMAIN and API_DOMAIN. Certificates persist in caddy-data.
  # Runs as the image's root user so it can own the named volumes, but with every capability dropped except
  # binding 80/443, a read-only root filesystem and no-new-privileges.
  proxy:
    <<: *hardening
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN must be set}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set}
    volumes:
      - ./infra/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp:size=16m
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      internal:
        ipv4_address: 172.30.0.10

networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
